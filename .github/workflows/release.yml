name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Prepare clean release config
        shell: pwsh
        run: |
          Copy-Item config.example.json config.json -Force

      - name: Run unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v

      - name: Build ErpGoPrintService.exe
        shell: pwsh
        run: |
          pyinstaller --noconsole `
            --onefile `
            --name "ErpGoPrintService" `
            --hidden-import "win32print" `
            --hidden-import "win32api" `
            --hidden-import "websockets" `
            --hidden-import "PyQt6" `
            --hidden-import "PyQt6.QtCore" `
            --hidden-import "PyQt6.QtGui" `
            --hidden-import "PyQt6.QtWidgets" `
            --hidden-import "PyQt6.QtNetwork" `
            --collect-all PyQt6 `
            --collect-all websockets `
            main.py -y

      - name: Build KCSM_PrintService_Setup.exe
        shell: pwsh
        run: |
          pyinstaller --noconsole `
            --onefile `
            --name "KCSM_PrintService_Setup" `
            --add-data "dist\ErpGoPrintService.exe;dist" `
            --add-data "config.example.json;." `
            --hidden-import "PyQt6" `
            --hidden-import "PyQt6.QtWidgets" `
            --hidden-import "PyQt6.QtCore" `
            --hidden-import "PyQt6.QtGui" `
            --collect-all PyQt6 `
            installer_wizard.py -y

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @("dist\KCSM_PrintService_Setup.exe", "dist\ErpGoPrintService.exe")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "KCSM Print Service ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/KCSM_PrintService_Setup.exe
            dist/ErpGoPrintService.exe
            dist/SHA256SUMS.txt
